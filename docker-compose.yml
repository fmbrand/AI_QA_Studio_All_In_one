# Full stack: PostgreSQL (with pgvector for Phase 2), migrations, API, worker and web.
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose up --build
# Web: http://localhost:3000   API docs: http://localhost:8000/api/docs

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://qa:${POSTGRES_PASSWORD:-qa}@db:5432/ai_qa_studio
    STORAGE_LOCAL_DIR: /data/storage
  volumes:
    - uploads:/data/storage
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa}
      POSTGRES_DB: ai_qa_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d ai_qa_studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
