name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_qa_studio_test

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_qa_studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Tesseract OCR (exercises the OCR test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic check
      - name: Unit, API, isolation, upload, context-engine and requirement tests
        run: uv run pytest

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_qa_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_qa_studio
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
      STORAGE_LOCAL_DIR: /tmp/aiqa-storage
      EMBEDDING_CACHE_DIR: /home/runner/.cache/aiqa-models
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/aiqa-models
          key: fastembed-bge-small-en-v1.5
      - name: Install backend and migrate
        working-directory: backend
        run: uv sync --frozen && uv run alembic upgrade head
      - name: Install frontend and browsers
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start the worker
        working-directory: backend
        run: nohup uv run python -m app.worker > /tmp/worker.log 2>&1 &
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Worker log
        if: failure()
        run: |
          cat /tmp/worker.log
          # Also surface the tail as an annotation (visible without log access).
          echo "::warning title=Worker log tail::$(tail -c 1500 /tmp/worker.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ai-qa-studio-api ./backend
      - run: docker build -t ai-qa-studio-web ./frontend
