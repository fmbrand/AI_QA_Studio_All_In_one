[project]
name = "ai-qa-studio-backend"
version = "0.1.0"
description = "AI QA Studio API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
    "anthropic>=2.14.0",
    "openai>=3.59.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["B008", "S101", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S608"]
"app/database/migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
